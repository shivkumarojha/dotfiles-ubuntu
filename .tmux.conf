# ============================================================
# TMUX CONFIG
# Omarchy defaults + personal workflow
# ============================================================


# ============================================================
# Prefix
# ============================================================

# Primary prefix
set -g prefix C-Space

# Keep traditional tmux prefix as secondary
set -g prefix2 C-b

bind -N "Send prefix" C-Space send-prefix


# ============================================================
# Config / Help
# ============================================================

bind -N "Reload configuration" q \
    source-file ~/.config/tmux/tmux.conf \;\
    display "Configuration reloaded"

bind -N "Show Tmux keybindings" ? \
    display-popup -E -w 80% -h 70% \
    -T "Tmux keybindings" \
    "omarchy-menu-tmux-keybindings --print | less -R"


# ============================================================
# Copy Mode
# ============================================================

setw -g mode-keys vi

# Start selection
bind -N "Begin selection" -T copy-mode-vi v \
    send -X begin-selection

# Copy selection and return to normal mode
bind -N "Copy selection" -T copy-mode-vi y \
    send -X copy-selection-and-cancel

# Also allow Enter to copy
bind -T copy-mode-vi Enter \
    send -X copy-selection-and-cancel


# ============================================================
# Pane Controls
# ============================================================

# Splits
# Alt+Enter      = vertical split (top/bottom)
# Alt+Shift+Enter = horizontal split (left/right)

bind -N "Split pane vertically" -n M-Enter \
    split-window -v -c "#{pane_current_path}"

bind -N "Split pane horizontally" -n M-S-Enter \
    split-window -h -c "#{pane_current_path}"


# Prefix + h/v splits
bind -N "Split pane vertically" h \
    split-window -v -c "#{pane_current_path}"

bind -N "Split pane horizontally" v \
    split-window -h -c "#{pane_current_path}"


# Old workflow: Alt+h / Alt+v
bind -n M-h split-window -v -c "#{pane_current_path}"
bind -n M-v split-window -h -c "#{pane_current_path}"


# Kill pane
bind -N "Kill pane" x kill-pane
bind -n M-x kill-pane
bind -n M-Escape kill-pane


# ============================================================
# Pane Navigation
# ============================================================

# Modern / reliable navigation with modifier + arrows

bind -N "Focus pane left" -n C-M-Left \
    select-pane -L

bind -N "Focus pane right" -n C-M-Right \
    select-pane -R

bind -N "Focus pane up" -n C-M-Up \
    select-pane -U

bind -N "Focus pane down" -n C-M-Down \
    select-pane -D


# Resize panes

bind -N "Resize pane left" -n C-M-S-Left \
    resize-pane -L 5

bind -N "Resize pane down" -n C-M-S-Down \
    resize-pane -D 5

bind -N "Resize pane up" -n C-M-S-Up \
    resize-pane -U 5

bind -N "Resize pane right" -n C-M-S-Right \
    resize-pane -R 5


# ============================================================
# Window Navigation
# ============================================================

# Create window
bind -N "Create window" c \
    new-window -c "#{pane_current_path}"

# Old shortcut
bind -n M-n \
    new-window -c "#{pane_current_path}"


# Rename window
bind -N "Rename window" r \
    command-prompt -I "#W" \
    "rename-window -- '%%'"

# Old shortcut
bind -n M-, \
    command-prompt -I "#W" \
    "rename-window -- '%%'"


# Kill window
bind -N "Kill window" k kill-window


# ============================================================
# Direct Window Selection
# ============================================================

# Normal number-row bindings
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9
bind -n M-0 select-window -t :10

# Symbol bindings — useful with your keyd number-row mapping
bind -n M-! select-window -t :1
bind -n M-@ select-window -t :2
bind -n M-# select-window -t :3
bind -n M-$ select-window -t :4
bind -n M-% select-window -t :5
bind -n M-^ select-window -t :6
bind -n M-& select-window -t :7
bind -n M-* select-window -t :8
bind -n M-( select-window -t :9
bind -n M-) select-window -t :10

# Previous / next window
bind -N "Previous window" -n M-Left \
    select-window -t -1

bind -N "Next window" -n M-Right \
    select-window -t +1


# Move window
bind -N "Move window left" -n M-S-Left \
    swap-window -t -1 \;\
    select-window -t -1

bind -N "Move window right" -n M-S-Right \
    swap-window -t +1 \;\
    select-window -t +1


# Choose tree (old workflow)
bind -n M-w choose-tree


# ============================================================
# Session Controls
# ============================================================

# Rename session
bind -N "Rename session" R \
    command-prompt -I "#S" \
    "rename-session -- '%%'"


# Create session
bind -N "Create session" C \
    new-session -c "#{pane_current_path}"


# Kill session
bind -N "Kill session" K kill-session


# Previous / next session using prefix
bind -N "Previous session" P switch-client -p
bind -N "Next session" N switch-client -n


# Direct session navigation
# These replace the old M-Up/M-Down pane navigation.
# Pane navigation is now C-M-Arrows.

bind -N "Previous session" -n M-Up \
    switch-client -p

bind -N "Next session" -n M-Down \
    switch-client -n


# ============================================================
# General Settings
# ============================================================

set -g default-terminal "tmux-256color"

set -ag terminal-overrides ",*:RGB"

set -g mouse on

# Start numbering from 1
set -g base-index 1
setw -g pane-base-index 1

# Keep window numbers compact
set -g renumber-windows on

# Large scrollback
set -g history-limit 50000

# Fast escape
set -g escape-time 0

# Receive focus events
set -g focus-events on

# Integrate tmux clipboard with system clipboard
set -g set-clipboard on

# Allow applications such as Neovim to use passthrough
set -g allow-passthrough on

# Resize panes intelligently
setw -g aggressive-resize on

# Don't automatically exit the client when the last session dies
set -g detach-on-destroy off

# Extended keyboard support
set -g extended-keys on
set -g extended-keys-format csi-u

set -ag terminal-features "xterm-kitty:extkeys"

# Clipboard terminal feature
set -as terminal-features ",*:clipboard"


# ============================================================
# Automatic Window Naming
# ============================================================

setw -g automatic-rename on

setw -g automatic-rename-format '#{b:pane_current_path}'


# ============================================================
# Terminal Titles
# ============================================================

set -g set-titles on

set -g set-titles-string '#h:#W'


# ============================================================
# Status Bar
# ============================================================

set -g status-position top

set -g status-interval 5

set -g status-left-length 30

set -g status-right-length 50

set -g window-status-separator ""

set -g status-style "bg=default,fg=default"


# Session
set -g status-left \
    "#[fg=black,bg=blue,bold] #S #[bg=default] "


# Right side
set -g status-right \
    "#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]#h "


# Windows
set -g window-status-format \
    "#[fg=brightblack] #I:#W "

set -g window-status-current-format \
    "#[fg=blue,bold] #I:#W "


# Pane borders
set -g pane-border-style "fg=brightblack"

set -g pane-active-border-style "fg=blue"

# Pane navigation — Vim style
bind -n M-m select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Messages
set -g message-style "bg=default,fg=blue"

set -g message-command-style "bg=default,fg=blue"


# Copy mode
set -g mode-style "bg=blue,fg=black"

setw -g clock-mode-colour blue


# ============================================================
# Tmux Resurrect / Continuum
# ============================================================
#
# These are loaded only if they exist.
# This prevents errors on systems where the plugins
# haven't been installed yet.
#

if-shell '[ -f ~/.tmux/tmux-resurrect/resurrect.tmux ]' \
    'run-shell ~/.tmux/tmux-resurrect/resurrect.tmux'

if-shell '[ -f ~/.tmux/tmux-continuum/continuum.tmux ]' \
    'run-shell ~/.tmux/tmux-continuum/continuum.tmux'


# Automatically restore sessions
set -g @continuum-restore 'on'

# Save every 1 minute
# Change to 15 if you prefer less frequent writes.
set -g @continuum-save-interval '1'

# Save pane contents
set -g @resurrect-capture-pane-contents 'on'

# Processes worth restoring
set -g @resurrect-processes \
    'vi vim nvim nano top htop bash zsh fish ssh'


# ============================================================
# End
# ============================================================
